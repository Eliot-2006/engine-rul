name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q -m "not data"
      - run: uv run engine-rul data download
      - run: uv run pytest -q -m data
      # reproducibility smoke test: retrain the fast frozen configs in an isolated directory and
      # compare with the published validation RMSE (cross-platform BLAS/OpenMP differences -> 1e-3)
      - run: uv run engine-rul repro-check --family constant life_prior ridge hgb --tol 1e-3 --root ${{ runner.temp }}/phase2
